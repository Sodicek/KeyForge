name: Release

on:
  push:
    tags:
      - "v*"
  # Manual run: builds and packages everything and keeps it as a workflow artifact, without touching any release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish "Random password generator"
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath "KeyForge-${{ matrix.rid }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "KeyForge-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VERSION="0.0.0"; fi
          bash packaging/macos/make-app.sh "publish/${{ matrix.rid }}" "$VERSION" "KeyForge-${{ matrix.rid }}.zip"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" KeyForge-${{ matrix.rid }}.* --clobber --repo "${{ github.repository }}"

      - name: Keep as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KeyForge-${{ matrix.rid }}
          path: KeyForge-${{ matrix.rid }}.*
